name: PR 698 Public On-Call Companion Patcher

on:
  push:
    branches:
      - fix/oncall-public-access-pay-form-20260815
    paths:
      - '.github/workflows/pr698-public-oncall-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out companion branch
        uses: actions/checkout@v4
        with:
          ref: fix/oncall-public-access-pay-form-20260815
          fetch-depth: 0

      - name: Apply public access boundary
        run: |
          set -euo pipefail
          python scripts/pr698_public_oncall_patch.py
          git diff --check

      - name: Validate public schedule source
        run: |
          set -euo pipefail
          node --check public.js
          node --check functions/api/ps-customers/index.js
          node --check functions/api/admin/oncall/notify/index.js
          grep -F "OnCall Pay Form" index.html
          grep -F "https://oncall.onenecklab.com/" functions/api/admin/oncall/notify/index.js
          ! grep -F "psCustomersTab" index.html
          ! grep -F 'psCustomers: "/api/ps-customers"' public.js
          ! grep -F "renderPsCustomers" public.js

      - name: Remove temporary patch controls and commit
        run: |
          set -euo pipefail
          rm -f scripts/pr698_public_oncall_patch.py
          rm -f .github/workflows/pr698-public-oncall-patcher.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(oncall): protect OneAssist PINs and publish schedule links"
          git push origin HEAD:fix/oncall-public-access-pay-form-20260815
